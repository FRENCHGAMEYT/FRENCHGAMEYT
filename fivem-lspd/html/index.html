<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>LSPD</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="panel" class="hidden">
    <div id="panel-header">
        <span id="panel-badge">⚖</span>
        <div>
            <div id="panel-title">L.S.P.D.</div>
            <div id="panel-sub" class="pill-on">● EN SERVICE</div>
        </div>
        <button id="close-btn" title="Fermer [Échap]">✕</button>
    </div>

    <div id="agent-row">
        <span id="agent-grade">—</span>
        <span class="sep">|</span>
        <span id="agent-mat">—</span>
    </div>

    <div id="actions">
        <button class="action-btn" data-action="search">
            <span class="action-icon">🔍</span>
            <span class="action-label">Fouiller</span>
        </button>
        <button class="action-btn" data-action="handcuff">
            <span class="action-icon">⛓</span>
            <span class="action-label">Menottes</span>
        </button>
        <button class="action-btn" data-action="unhandcuff">
            <span class="action-icon">🔓</span>
            <span class="action-label">Libérer</span>
        </button>
        <button class="action-btn" data-action="identity">
            <span class="action-icon">🪪</span>
            <span class="action-label">Contrôle ID</span>
        </button>
        <button class="action-btn" data-action="radar">
            <span class="action-icon">📡</span>
            <span class="action-label">Radar</span>
        </button>
        <button class="action-btn" data-action="lockpick">
            <span class="action-icon">🗝</span>
            <span class="action-label">Crocheter</span>
        </button>
        <button class="action-btn" data-action="impound">
            <span class="action-icon">🚗</span>
            <span class="action-label">Fourrière</span>
        </button>
        <button class="action-btn" data-action="spike">
            <span class="action-icon">📌</span>
            <span class="action-label">Hérissons</span>
        </button>
    </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
