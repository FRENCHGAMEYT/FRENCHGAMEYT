<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>LSPD</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="overlay" class="hidden">
    <div id="panel">

        <!-- Header -->
        <div id="header">
            <div id="header-left">
                <div id="shield">⚖</div>
                <div id="header-text">
                    <div id="dept-name">LOS SANTOS POLICE DEPT.</div>
                    <div id="dept-sub">SYSTÈME DE GESTION OPÉRATIONNELLE</div>
                </div>
            </div>
            <div id="header-right">
                <div id="duty-pill" class="pill-off">● HORS SERVICE</div>
                <button id="close-btn">✕</button>
            </div>
        </div>

        <!-- Agent bar -->
        <div id="agent-bar">
            <div class="agent-cell">
                <div class="agent-label">MATRICULE</div>
                <div class="agent-value" id="ab-matricule">—</div>
            </div>
            <div class="agent-sep"></div>
            <div class="agent-cell">
                <div class="agent-label">GRADE</div>
                <div class="agent-value accent" id="ab-grade">—</div>
            </div>
            <div class="agent-sep"></div>
            <div class="agent-cell">
                <div class="agent-label">UNITÉ</div>
                <div class="agent-value" id="ab-unit">Aucune</div>
            </div>
        </div>

        <!-- Tabs -->
        <div id="tabs">
            <button class="tab active" data-tab="units">🛡 Unités</button>
            <button class="tab" data-tab="outfits">👔 Tenues</button>
            <button class="tab" data-tab="armory">🔫 Armurerie</button>
        </div>

        <!-- Content -->
        <div id="content">
            <div class="pane active" id="pane-units">
                <div class="grid" id="units-grid"></div>
            </div>
            <div class="pane" id="pane-outfits">
                <div class="grid" id="outfits-grid"></div>
            </div>
            <div class="pane" id="pane-armory">
                <div id="armory-list"></div>
            </div>
        </div>

        <!-- Footer -->
        <div id="footer">
            <button id="duty-btn" class="duty-btn-off">⏻ &nbsp;Prise / Fin de service</button>
        </div>

    </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
